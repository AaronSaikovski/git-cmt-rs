name: Rust CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  build-test-lint:
    name: Build, Test, Lint (matrix)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust toolchain (stable)
        id: toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cache cargo registry + build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-${{ steps.toolchain.outputs.cachekey }}-

      - name: Show rustc/cargo versions
        run: |
          rustc -Vv
          cargo -V

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Build (release)
        run: cargo build --release --locked

      - name: Test
        env:
          # Tests build requests locally; no live backend or API key is needed.
          OPENAI_API_KEY: ""
        run: cargo test --all --locked --no-default-features

      - name: Check LM Studio wrapper
        shell: bash
        run: |
          bash -n scripts/git-cmt
          GIT_CMT_RS_BIN=./target/release/git-cmt-rs
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            GIT_CMT_RS_BIN="${GIT_CMT_RS_BIN}.exe"
          fi
          export GIT_CMT_RS_BIN
          bash scripts/git-cmt --help
          bash scripts/git-cmt --version

      - name: Upload binary artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: git-cmt-rs-${{ github.sha }}-linux-amd64
          path: target/release/git-cmt-rs
          if-no-files-found: error

  # Dependency security audit on Linux.
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo audit
        run: cargo audit --deny warnings
